<!doctype html>
<html lang="en" data-bs-theme="dark" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NY Atlas | Map</title>

    <link rel="stylesheet" href="../Scss/main.css" />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="contribute.css" />
    <script
      id="search-js"
      defer=""
      src="https://api.mapbox.com/search-js/v1.5.1/web.js"
    ></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
  </head>

  <body class="d-flex flex-column h-100">
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a
          class="navbar-brand bg-dark p-1 rounded d-flex justify-content-center align-items-center gap-1"
          href="../index.html"
          ><span class="badge bg-primary">NY</span><span>Atlas</span></a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-between"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="../Map/map.html"
                ><i class="bi bi-search me-2"></i>Find</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href=""
                ><i class="bi bi-patch-plus me-2"></i>Contribute</a
              >
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="../About/about.html"
                ><span class="me-2"></span>About us</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../Credits/credits.html"
                ><i class="bi bi-clipboard me-2"></i>Credits</a
              >
            </li>
            <li class="nav-item py-2 py-lg-1 col-12 col-lg-auto">
              <div class="vr d-none d-lg-flex h-100 mx-lg-2 bg-white"></div>
              <hr class="d-lg-none my-2 text-white-50" />
            </li>
            <li class="nav-item dropdown" data-bs-theme="light">
              <a
                class="nav-link dropdown-toggle d-flex align-items-center"
                href="#"
                id="theme-menu"
                aria-expanded="false"
                data-bs-toggle="dropdown"
                data-bs-display="static"
                aria-label="Toggle theme"
              >
                <i class="bi bi-circle-half"></i>
                <span class="d-lg-none ms-2">Toggle theme</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <button
                    id="Light_Theme_BTN"
                    type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="light"
                    aria-pressed="false"
                  >
                    <i class="bi bi-sun-fill"></i
                    ><span class="ms-2">Light</span>
                  </button>
                </li>
                <li>
                  <button
                    id="Dark_Theme_BTN"
                    type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="dark"
                    aria-pressed="true"
                  >
                    <i class="bi bi-moon-stars-fill"></i
                    ><span class="ms-2">Dark</span>
                  </button>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main
      class="p-0 m-0 flex-grow-1 container-fluid d-flex flex-column align-items-center"
    >
      <section
        class="container-fluid h-100 p-0 m-0 d-flex flex-column align-items-center justify-content-center"
      >
        <div
          class="container-fluid p-0 m-0 h-100 w-100 position-relative d-flex flex-column-reverse flex-md-row"
        >
          <div
            id=""
            class="col-md-6 col-lg-4 h-100 d-flex flex-column align-items-center p-2 overflow-y-scroll"
          >
            <h2 class="text-center">Suggest a new location</h2>
            <form id="Suggestion_Form_DOM" class="ps-3 pe-3">
              <div class="form-floating mb-3">
                <input
                  type="email"
                  class="form-control"
                  id="Email_Address"
                  placeholder="email@example.com"
                  value="" required
                />
                <label class="form-label required" for="Email_Address">Your email</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="Place_Name"
                  placeholder="Place Name" required
                />
                <label class="form-label required" for="Place_Name">Place Name</label>
              </div>

              <div class="mb-3">
                <label for="Resource_Type_Datalist_Input" class="form-label required">Resource type</label
                >
                <input
                  class="form-control"
                  list="Resource_Types_Datalist_Options"
                  id="Resource_Type_Datalist_Input"
                  placeholder="Type to search..." required
                />
                <datalist id="Resource_Types_Datalist_Options">
                  <option value="Bathroom"></option>
                  <option value="Shelter"></option>
                  <option value="Food Panstries"></option>
                </datalist>
              </div>

              <div class="mb-3" id="Geolocation_Container">
                <label class="form-label required">Which type of geolocation type you want to use?</label>
                <div class="input-group">
                  <div class="form-check w-100">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="Geolocation_Type"
                    id="Address_Radio_Input"
                    value="Coordinate"
                    checked
                  />
                  <label class="form-check-label" for="Address_Radio_Input">
                    Address
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="Address_Input"
                    placeholder="Address" required
                  />
                </div>

                <div class="form-check w-100">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="Geolocation_Type"
                    id="Coordinate_Radio_Input"
                    value="Coordinate"
                  />
                  <label class="form-check-label" for="Coordinate_Radio_Input">
                    Coordinate
                  </label>
                  <div class="input-group">
                    <button id="Copy_Coordinate" type="button" class="btn btn-primary" >Copy</button>
                    <input
                    type="text"
                    class="form-control"
                    id="Coordinate_Input"
                    placeholder="[Latitude, Longitude]" required
                  />
                  </div>
                </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="Description_Input" class="form-label"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="Description_Input"
                  rows="3"
                ></textarea>
              </div>

              <div class="mb-3">
                <button id="Submit_BTN" class="btn btn-primary btn" type="submit">Submit form</button>
              </div>

            </form>
          </div>
          <div id="map"></div>
          <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div
              class="toast"
              role="alert"
              aria-live="assertive"
              aria-atomic="true"
              id="Map_Lighting_Mode_Reminder_Toast"
            >
              <div class="toast-header">
                <strong class="me-auto">Tip🔨😎</strong>
                <small>just now</small>
                <button
                  type="button"
                  class="btn-close ms-2 mb-1"
                  data-bs-dismiss="toast"
                  aria-label="Close"
                >
                  <span aria-hidden="true"></span>
                </button>
              </div>
              <div class="toast-body">
                Hello! You can use the <i class="bi bi-circle-half"></i> button
                of this page to change the lighting of the map to day and night
                🙌 <br />
                Choose a map lighting to stop this message from appearing
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="../env.js"></script>
    <script src="contribute.js" defer></script>
    <script src="form_validator.js" defer></script>
    <script src="form.js" defer></script>
  </body>
</html>

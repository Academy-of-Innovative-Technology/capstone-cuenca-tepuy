<!doctype html>
<html lang="en" data-bs-theme="dark" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food & Home | Find</title>

    <link rel="stylesheet" href="../Scss/main.css" />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="map.css" />
    <script
      id="search-js"
      defer=""
      src="https://api.mapbox.com/search-js/v1.5.1/web.js"
    ></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
  </head>

  <body class="d-flex flex-column h-100">
    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="offcanvas_map_info"
      aria-labelledby="offcanvasLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasLabel">
          Location Information
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        Content for the offcanvas goes here. You can place just about any
        Bootstrap component or custom elements here.
      </div>
    </div>

    <nav class="navbar sticky-top navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">Food & Home</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="../Map/map.html"><i class="bi bi-search me-2"></i>Find</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href=""><i class="bi bi-patch-plus me-2"></i>Contribute</a>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="../About/about.html"><span class="me-2">😎</span>About us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href=""><i class="bi bi-clipboard me-2"></i>Credits</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main
      class="p-0 m-0 flex-grow-1 container-fluid d-flex flex-column align-items-center"
    >
      <section
        class="container-fluid h-100 p-0 m-0 d-flex flex-column align-items-center justify-content-center"
      >
        <div class="container-fluid p-0 m-0 h-100 w-100 position-relative">
          <nav id="menu"></nav>
          <div id="map"></div>

          <div
            class="btn-group position-absolute"
            id="Map_Layer_Controls"
            role="group"
            aria-label="Basic checkbox toggle button group"
          ></div>
        </div>
      </section>
    </main>
    <script src="../env.js"></script>
    <script src="api_data_manager.js"></script>
    <script src="names.js"></script>
    <script src="offcanvas.js" defer></script>
    <script src="map.js" defer></script>
  </body>
</html>

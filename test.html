<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NYC POI Scaling Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
mapboxgl.accessToken = "YOUR_MAPBOX_ACCESS_TOKEN";

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/streets-v12",
  center: [-73.9851, 40.7589], // NYC (Times Square)
  zoom: 12
});

map.on("load", () => {

  // Sample POI data (you can replace this later)
  map.addSource("pois", {
    type: "geojson",
    data: {
      type: "FeatureCollection",
      features: [
        {
          type: "Feature",
          properties: { name: "POI 1" },
          geometry: { type: "Point", coordinates: [-73.9851, 40.7589] }
        },
        {
          type: "Feature",
          properties: { name: "POI 2" },
          geometry: { type: "Point", coordinates: [-73.9815, 40.7527] }
        },
        {
          type: "Feature",
          properties: { name: "POI 3" },
          geometry: { type: "Point", coordinates: [-73.9772, 40.7614] }
        }
      ]
    }
  });

  // Add symbol layer with NYC perception scaling
  map.addLayer({
    id: "poi-layer",
    type: "symbol",
    source: "pois",
    layout: {
      "icon-image": "marker-15",

      "icon-size": [
        "interpolate",
        ["exponential", 1.6],
        ["zoom"],
        10, 0.15,
        12, 0.25,
        14, 0.45,
        15, 0.7,
        16, 1.1,
        17, 1.6,
        18, 2.3,
        19, 3.2,
        20, 4.5
      ],

      "text-field": ["get", "name"],
      "text-offset": [0, 1.2],
      "text-anchor": "top",

      "text-size": [
        "interpolate",
        ["linear"],
        ["zoom"],
        12, 10,
        16, 14,
        20, 20
      ],

      "icon-allow-overlap": false
    }
  });

});
</script>

</body>
</html>
